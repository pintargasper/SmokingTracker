name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app: 
              - 'app/**' 
              - 'gradle/**' 
              - 'build.gradle*' 
              - 'settings.gradle*' 
              - 'gradle.properties' 
              - 'gradlew' 
              - 'gradlew.bat'
              - 'tools/scripts/dummy_data.py'

  build:
    needs: changes
    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Build Debug APK and Run Unit Tests
        run: ./gradlew assembleDebug test

  androidTest:
    needs: changes
    if: | 
      needs.changes.outputs.app == 'true' || 
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 34
            target: aosp_atd
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: |
          pip install openpyxl

      - name: Generate dummy data
        run: |
          python tools/scripts/dummy_data.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          test -e /dev/kvm

      - name: Run Instrumented Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096MB
          force-avd-creation: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu off -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |

            ./gradlew assembleDebug

            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb push tools/scripts/dummy_data/dummy_data.xlsx /data/local/tmp/dummy_data.xlsx
            adb shell run-as com.gasperpintar.smokingtracker mkdir -p /data/user/0/com.gasperpintar.smokingtracker/files
            adb shell run-as com.gasperpintar.smokingtracker cp /data/local/tmp/dummy_data.xlsx /data/user/0/com.gasperpintar.smokingtracker/files/dummy_data.xlsx
            adb shell rm /data/local/tmp/dummy_data.xlsx

            ./gradlew connectedDebugAndroidTest