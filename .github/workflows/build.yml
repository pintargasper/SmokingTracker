name: Build

on:
  push:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle*'
              - 'settings.gradle*'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'tools/scripts/dummy_data.py'

  lint:
    needs: changes
    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint

  build:
    needs:
      - changes
      - lint

    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  test:
    needs: changes
    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

  check-emulator:
    needs: 
      - changes
      - build
    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Determine emulator matrix
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] ||
            [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'matrix={"include":[{"name":"API 34","api-level":34,"target":"aosp_atd"},{"name":"API 26","api-level":26,"target":"default"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"name":"API 34","api-level":34,"target":"aosp_atd"}]}' >> "$GITHUB_OUTPUT"
          fi

  androidTest:
    needs:
      - changes
      - lint
      - build
      - test
      - check-emulator

    if: |
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-emulator.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Generate dummy data
        run: python tools/scripts/dummy_data.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          test -e /dev/kvm

      - name: Run Instrumented Tests for (${{ matrix.name }})
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096MB
          force-avd-creation: false
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu off -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb push tools/scripts/dummy_data/dummy_data.xlsx /data/local/tmp/dummy_data.xlsx
            adb shell run-as com.gasperpintar.smokingtracker mkdir -p /data/user/0/com.gasperpintar.smokingtracker/files
            adb shell run-as com.gasperpintar.smokingtracker cp /data/local/tmp/dummy_data.xlsx /data/user/0/com.gasperpintar.smokingtracker/files/dummy_data.xlsx
            adb shell rm /data/local/tmp/dummy_data.xlsx

            ./gradlew connectedDebugAndroidTest