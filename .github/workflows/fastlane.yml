name: Fastlane

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      pull_request_number:
        description: "Pull request number created by this workflow"
        value: ${{ jobs.screenshots.outputs.pull-request-number }}

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    outputs:
      pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          pip install openpyxl
          pip install Pillow

      - name: Set system date to last Sunday 22:00
        run: |
          sudo timedatectl set-timezone Europe/Ljubljana
          LAST_SUNDAY=$(date -d "last sunday" "+%Y-%m-%d")
          sudo date -s "${LAST_SUNDAY} 22:00:00"
          echo "TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Generate dummy data
        run: |
          python tools/scripts/dummy_data.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Set up Fastlane
        run: sudo gem install fastlane

      - name: Fix line endings and make gradlew executable
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Check KVM
        run: |
          ls -l /dev/kvm
          test -e /dev/kvm

      - name: Generate Screenshots
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096MB
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
          
            adb shell wm size 1080x2400
            adb shell wm density 400

            adb root
            adb wait-for-device
            sleep 2

            adb shell settings put global auto_time 0
            adb shell settings put global auto_time_zone 0
            adb shell setprop persist.sys.timezone Europe/Ljubljana

            adb shell su 0 date -s "@${TIMESTAMP}"

            sleep 3
            
            ./gradlew assembleDebug assembleAndroidTest

            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell input keyevent KEYCODE_WAKEUP
            sleep 2

            adb push tools/scripts/dummy_data/dummy_data.xlsx /data/local/tmp/dummy_data.xlsx
            adb shell run-as com.gasperpintar.smokingtracker mkdir -p /data/user/0/com.gasperpintar.smokingtracker/files
            adb shell run-as com.gasperpintar.smokingtracker cp /data/local/tmp/dummy_data.xlsx /data/user/0/com.gasperpintar.smokingtracker/files/dummy_data.xlsx
            adb shell rm /data/local/tmp/dummy_data.xlsx

            fastlane screengrab

      - name: Crop screenshots
        run: |
          python tools/scripts/image_cropper.py

      - name: Remove generated HTML
        run: |
          rm -f fastlane/metadata/android/screenshots.html

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Update fastlane app screenshots"
          title: "Update app screenshots"
          body: "Automated pull request containing the latest app screenshots captured by GitHub Actions."
          branch: update-screenshots
          delete-branch: true
          add-paths: |
            fastlane/metadata/android/

          assignees: "pintargasper"
          labels: "screenshots, fastlane"