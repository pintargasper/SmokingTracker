name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.0)"
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Check app version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release version: ${VERSION}"
            echo "Expected format: vMAJOR.MINOR.PATCH (e.g. v1.2.0)"
            exit 1
          fi

          EXPECTED_VERSION_NAME="${VERSION#v}"

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)

          if ! [[ "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not determine a valid versionCode from app/build.gradle.kts."
            exit 1
          fi

          echo "Available tags:"
          git tag --sort=-version:refname | head -10

          PREVIOUS_TAG=$(
            git tag \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | awk -v current="${VERSION}" '
                  $0 == current { found = 1; exit }
                  { last = $0 }
                  END { if (last != "") print last }
                '
          )

          if [ -z "${PREVIOUS_TAG}" ]; then
            echo "ERROR: No previous release tag found."
            exit 1
          fi

          PREVIOUS_VERSION_CODE=$(git show "${PREVIOUS_TAG}:app/build.gradle.kts" \
          | grep -oP 'versionCode\s*=\s*\K[0-9]+' \
          | head -1)

          if [ -z "${PREVIOUS_VERSION_CODE}" ]; then
            echo "ERROR: Could not determine versionCode from previous tag."
            echo "Previous tag: ${PREVIOUS_TAG}"
            exit 1
          fi

          echo "Input version:           ${VERSION}"
          echo "Expected versionName:    ${EXPECTED_VERSION_NAME}"
          echo "Current versionName:     ${VERSION_NAME}"
          echo "Current versionCode:     ${VERSION_CODE}"
          echo "Previous versionCode:    ${PREVIOUS_VERSION_CODE}"

          if [ "${VERSION_NAME}" != "${EXPECTED_VERSION_NAME}" ]; then
            echo "ERROR: versionName does not match release input."
            echo "Expected: ${EXPECTED_VERSION_NAME}"
            echo "Found:    ${VERSION_NAME}"
            exit 1
          fi

          if [ "${VERSION_CODE}" -le "${PREVIOUS_VERSION_CODE}" ]; then
            echo "ERROR: versionCode must be greater than the previous versionCode."
            echo "Previous: ${PREVIOUS_VERSION_CODE}"
            echo "Found:    ${VERSION_CODE}"
            exit 1
          fi

          echo "App version check passed."

      - name: Check release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          NOTES="release/notes/${VERSION}.md"
          CHANGELOG="release/changelogs/en-US/${VERSION}.txt"

          if [ ! -s "$NOTES" ]; then
            echo "ERROR: Release notes not found:"
            echo "$NOTES"
            exit 1
          fi

          if [ ! -s "$CHANGELOG" ]; then
            echo "ERROR: App changelog not found:"
            echo "$CHANGELOG"
            exit 1
          fi

          echo "Release notes found: $NOTES"
          echo "App changelog found: $CHANGELOG"
  
  build:
   needs: release
   uses: ./.github/workflows/build.yml

  fastlane:
   needs: build
   uses: ./.github/workflows/fastlane.yml
   permissions:
      contents: write
      pull-requests: write

  prepare:
    needs: fastlane
    uses: ./.github/workflows/prepare.yml
    permissions:
      contents: write
      pull-requests: write
    secrets:
      client_id: ${{ secrets.MERGE_APP_CLIENT_ID }}
      private_key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
    with:
      version: ${{ inputs.version }}
      pull_request_number: ${{ needs.fastlane.outputs.pull_request_number }}

  publish:
    needs: prepare
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    secrets:
      keystore_base64: ${{ secrets.KEYSTORE_BASE64 }}
      keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
      key_alias: ${{ secrets.KEY_ALIAS }}
      key_password: ${{ secrets.KEY_PASSWORD }}
      service_account_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}
    with:
      version: ${{ inputs.version }}
      release_sha: ${{ needs.prepare.outputs.release_sha }}